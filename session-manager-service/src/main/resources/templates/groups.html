<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${event.name + ' · Groups'}">Groups</title><link rel="stylesheet" href="/assets/session-manager.css"><script type="module" src="/assets/group-display.js"></script></head>
<body><main class="shell" th:attr="data-event-id=${event.id}"><header><nav class="screen-only"><a th:href="@{/events/{id}(id=${event.id})}">← Registration</a></nav><p class="eyebrow">LIVE GROUP DISPLAY</p><h1 id="event-heading" th:text="${event.name}">Event</h1><p class="screen-only muted">Updates automatically every two seconds. Proposals require organizer action before they are final.</p><div class="toolbar"><button id="print-roster" disabled>Print roster</button><button id="export-csv" class="secondary" disabled>Export CSV</button></div></header><section class="card"><div id="assignment" aria-live="polite"><p>Loading current assignment…</p></div></section></main></body></html>
