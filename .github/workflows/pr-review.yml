name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Maven verification
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: session_manager
          POSTGRES_USER: session_manager
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U session_manager -d session_manager"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require the proposed merge commit
        env:
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PR_MERGE_SHA" ]; then
            echo '::error::Maven verification must test the proposed merge with the base branch.'
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Maven reactor on PostgreSQL
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/session_manager
          TEST_DATABASE_PASSWORD: ci-only-password
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Check browser JavaScript syntax
        if: ${{ hashFiles('session-manager-service/src/main/resources/static/assets/*.js') != '' }}
        run: |
          for script in session-manager-service/src/main/resources/static/assets/*.js; do
            node --input-type=module --check < "$script"
          done
      - name: Publish JaCoCo coverage report
        if: ${{ !cancelled() && (success() || hashFiles('**/target/site/jacoco/jacoco.xml') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: "**/target/site/jacoco/"
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Java quality checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting, style, and bugs
        run: mvn --batch-mode --no-transfer-progress -Pquality -DskipTests -Djacoco.skip=true verify
