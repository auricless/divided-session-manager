name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Maven verification
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require the proposed merge commit
        env:
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PR_MERGE_SHA" ]; then
            echo '::error::Maven verification must test the proposed merge with the base branch.'
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Maven reactor
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Publish JaCoCo coverage report
        if: ${{ !cancelled() && (success() || hashFiles('session-manager-core/target/site/jacoco/jacoco.xml') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: session-manager-core/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14
