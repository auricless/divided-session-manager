name: Container checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pom.xml'
      - 'session-manager-core/**'
      - 'session-manager-service/**'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'frontend/**'
      - 'scripts/smoke-container-stack.py'
      - 'scripts/test-compose-contract.py'
      - 'scripts/test-runtime-tool-policy.py'
      - 'scripts/test-frontend-install-policy.py'
      - 'scripts/smoke-assignment-api.sh'
      - 'scripts/test-smoke-assignment-api.py'
      - '.github/workflows/container-checks.yml'

permissions:
  contents: read

concurrency:
  group: container-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container build and HTTP smoke
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require the requested revision
        env:
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PR_MERGE_SHA" ]; then
            echo '::error::Container verification must test the requested revision.'
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify deployment contract and startup retries
        run: |
          python3 scripts/test-compose-contract.py
          python3 scripts/test-runtime-tool-policy.py
          python3 scripts/test-frontend-install-policy.py
          python3 scripts/test-smoke-assignment-api.py
      - name: Install browser acceptance tools
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build and start all three containers
        run: docker compose -p session-manager-ci up --build --detach --wait --wait-timeout 150
      - name: Exercise the stateless assignment endpoint through the UI proxy
        run: sh scripts/smoke-assignment-api.sh
      - name: Exercise the React workflow in Chromium
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify images, routing, isolation, persistence and database recovery
        run: python3 scripts/smoke-container-stack.py --project session-manager-ci
      - name: Preserve failed browser traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-stack-failure-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose -p session-manager-ci logs
      - name: Stop the test stack
        if: ${{ always() }}
        run: docker compose -p session-manager-ci down --volumes
