services:
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: session-manager-ui:local
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    depends_on:
      session-manager-service:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped
    stop_grace_period: 10s
  session-manager-service:
    build:
      context: .
      dockerfile: session-manager-service/Dockerfile
    image: session-manager-service:local
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/session_manager
      DATABASE_USER: session_manager
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local database}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks: [app, data]
    restart: unless-stopped
    stop_grace_period: 30s
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: session_manager
      POSTGRES_USER: session_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local database}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
networks:
  app:
  data:
    internal: true
volumes:
  postgres-data:
